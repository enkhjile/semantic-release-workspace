name: Full verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Fast checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix: &node-matrix
        include:
          - node: project
            # Empty lets pnpm/setup read devEngines.runtime from package.json.
            runtime: ""
          - node: minimum
          - node: latest
            runtime: node@latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read minimum Node.js from package.json
        if: matrix.node == 'minimum'
        id: minimum
        run: |
          echo "runtime=node@$(jq -r '.engines.node | match("[0-9]+\\.[0-9]+\\.[0-9]+").string' package.json)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js, pnpm, and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: ${{ steps.minimum.outputs.runtime || matrix.runtime }}
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit

  integration:
    name: Verify (Node ${{ matrix.node }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix: *node-matrix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read minimum Node.js from package.json
        if: matrix.node == 'minimum'
        id: minimum
        run: |
          echo "runtime=node@$(jq -r '.engines.node | match("[0-9]+\\.[0-9]+\\.[0-9]+").string' package.json)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js, pnpm, and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: ${{ steps.minimum.outputs.runtime || matrix.runtime }}
          cache: true
          require-lockfile: true
      - name: Install stable Rust for Cargo integration tests
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install uv and Python for Python integration tests
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.15.2"
          enable-cache: false
      - name: Select the Python interpreter for native builds and artifact validation
        run: |
          uv python install 3.15.2
          echo "$(dirname "$(uv python find 3.15.2)")" >> "$GITHUB_PATH"
      - run: pnpm test:integration
      - run: pnpm pack
