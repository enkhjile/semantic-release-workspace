name: Verify and release

on:
  pull_request:
  push:
    branches: [main, alpha]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Fast checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: project
            # Empty lets pnpm/setup read devEngines.runtime from package.json.
            runtime: ""
          - node: minimum
          - node: latest
            runtime: node@latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read minimum Node.js from package.json
        if: matrix.node == 'minimum'
        id: minimum
        run: |
          echo "runtime=node@$(jq -r '.engines.node | ltrimstr(">=")' package.json)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js, pnpm, and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: ${{ steps.minimum.outputs.runtime || matrix.runtime }}
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit

  integration:
    name: Verify (Node ${{ matrix.node }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: project
            # Empty lets pnpm/setup read devEngines.runtime from package.json.
            runtime: ""
          - node: minimum
          - node: latest
            runtime: node@latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether integration tests are needed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # Release-branch pushes and manual runs always verify the full matrix.
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Three dots cover the whole PR; no-renames keeps deleted code visible.
          if ! git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" -- > "$RUNNER_TEMP/changed-paths"; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -s "$RUNNER_TEMP/changed-paths" ]]; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r -d '' path; do
            case "$path" in
              README.md|CONTRIBUTING.md|AGENTS.md|docs/*.md) ;;
              *) echo "integration=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"
          echo "integration=false" >> "$GITHUB_OUTPUT"
      - name: Read minimum Node.js from package.json
        if: steps.changes.outputs.integration != 'false' && matrix.node == 'minimum'
        id: minimum
        run: |
          echo "runtime=node@$(jq -r '.engines.node | ltrimstr(">=")' package.json)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js, pnpm, and dependencies
        if: steps.changes.outputs.integration != 'false'
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: ${{ steps.minimum.outputs.runtime || matrix.runtime }}
          cache: true
          require-lockfile: true
      - name: Install stable Rust for Cargo integration tests
        if: steps.changes.outputs.integration != 'false'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - run: pnpm test:integration
        if: steps.changes.outputs.integration != 'false'
      - run: pnpm pack
        if: steps.changes.outputs.integration != 'false'

  release:
    needs: [verify, integration]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/alpha')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js, pnpm, and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build
      - name: Report publishing npm version
        run: pnpm exec npm --version
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
